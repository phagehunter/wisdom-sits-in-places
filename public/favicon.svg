        stroke-linejoin="round"/>
  <path d="M 14 30 L 50 30" stroke="#e0c088" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 18.5 38 q 6.75 -4 13.5 0 q 6.75 4 13.5 0 L 45 46 Q 32 51 19 46 Z" fill="#0e7490" opacity="0.6"/>
  <path d="M 18.5 38 q 6.75 -4 13.5 0 q 6.75 4 13.5 0" fill="none" stroke="#5eead4" stroke-width="1.5"/>
</svg>
